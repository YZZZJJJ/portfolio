<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集在线画廊</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background-color: #121212; color: #fff; padding: 2rem 1rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 2rem; }
        .upload-area { background: #1f1f1f; padding: 2rem; border-radius: 12px; text-align: center; margin-bottom: 2rem; }
        #fileInput { display: none; }
        .btn { padding: 12px 26px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .btn:hover { background: #2563eb; }
        .btn:disabled { opacity: 0.65; cursor: wait; }
        .tip { margin-top: 10px; font-size: 13px; color: #aaa; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .img-card { background: #1f1f1f; border-radius: 10px; overflow: hidden; transition: 0.3s; }
        .img-card:hover { transform: translateY(-5px); }
        .img-card img { width: 100%; height: 220px; object-fit: cover; cursor: pointer; }
        .desc { padding: 12px; font-size: 14px; }
        .del-btn { width: 100%; padding: 8px; background: #333; color: #ff8888; border: none; cursor: pointer; }
        .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.93); display: none; align-items: center; justify-content: center; z-index: 999; }
        .modal img { max-width: 92%; max-height: 92vh; }
        .close { position: absolute; top: 24px; right: 36px; color: #fff; font-size: 42px; cursor: pointer; background: transparent; border: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>作品集在线画廊</h1>
            <p>作品展示</p>
        </div>
        <div class="upload-area">
            <h3>上传作品图片</h3>
            <p class="tip">图片上传至 Cloudinary；图片列表保存在本浏览器中</p>
            <input type="file" id="fileInput" accept="image/*">
            <button class="btn" id="chooseButton" type="button">选择图片上传</button>
        </div>
        <div class="gallery" id="gallery"></div>
        <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="图片预览">
            <button class="close" id="closeButton" type="button" aria-label="关闭">&times;</button>
            <img id="modalImg" alt="作品大图">
        </div>
    </div>

    <script>
        const cloudName = 'trbh8p1q';
        const uploadPreset = 'atom_portfolio';

        const fileInput = document.getElementById('fileInput');
        const chooseButton = document.getElementById('chooseButton');
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        let imageList = loadImages();

        function loadImages() {
            try {
                const saved = JSON.parse(localStorage.getItem('galleryImages') || '[]');
                return Array.isArray(saved) ? saved.filter(item => item && item.url) : [];
            } catch (error) {
                console.error('读取本地图片列表失败：', error);
                return [];
            }
        }

        function saveImages() {
            localStorage.setItem('galleryImages', JSON.stringify(imageList));
        }

        function renderGallery() {
            gallery.replaceChildren();
            imageList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'img-card';

                const image = document.createElement('img');
                image.src = item.url;
                image.alt = `作品 #${index + 1}`;
                image.addEventListener('click', () => openModal(item.url));

                const description = document.createElement('div');
                description.className = 'desc';
                description.textContent = `作品 #${index + 1}`;

                const deleteButton = document.createElement('button');
                deleteButton.className = 'del-btn';
                deleteButton.type = 'button';
                deleteButton.textContent = '删除';
                deleteButton.addEventListener('click', () => {
                    imageList.splice(index, 1);
                    saveImages();
                    renderGallery();
                });

                card.append(image, description, deleteButton);
                gallery.appendChild(card);
            });
        }

        function openModal(src) {
            modalImg.src = src;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            modalImg.removeAttribute('src');
        }

        chooseButton.addEventListener('click', () => fileInput.click());
        document.getElementById('closeButton').addEventListener('click', closeModal);
        modal.addEventListener('click', event => {
            if (event.target === modal) closeModal();
        });

        fileInput.addEventListener('change', async event => {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', uploadPreset);
            chooseButton.disabled = true;
            chooseButton.textContent = '上传中...';

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
                    method: 'POST',
                    body: formData
                });
                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch {
                    throw new Error(`Cloudinary 返回了非 JSON 数据（HTTP ${response.status}）`);
                }

                // HTTP 200 只代表请求成功，还要确认返回了图片地址。
                const imageUrl = data.secure_url || data.url;
                if (!response.ok || !imageUrl) {
                    const cloudinaryMessage = data.error?.message || '响应中没有 secure_url';
                    throw new Error(`${cloudinaryMessage}（HTTP ${response.status}）`);
                }

                imageList.push({ url: imageUrl });
                saveImages();
                renderGallery();
                alert('上传成功！');
            } catch (error) {
                console.error('Cloudinary 上传失败：', error);
                alert(`上传失败：${error.message}`);
            } finally {
                fileInput.value = '';
                chooseButton.disabled = false;
                chooseButton.textContent = '选择图片上传';
            }
        });

        renderGallery();
    </script>
</body>
</html>
