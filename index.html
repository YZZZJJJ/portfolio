<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集在线画廊</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background-color: #121212; color: #fff; padding: 2rem 1rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 2rem; }
        .upload-area { background: #1f1f1f; padding: 2rem; border-radius: 12px; text-align: center; margin-bottom: 2rem; }
        #fileInput { display: none; }
        .btn { padding: 12px 26px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .btn:hover { background: #2563eb; }
        .btn:disabled { opacity: 0.65; cursor: wait; }
        .tip { margin-top: 10px; font-size: 13px; color: #aaa; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .img-card { background: #1f1f1f; border-radius: 10px; overflow: hidden; transition: 0.3s; }
        .img-card:hover { transform: translateY(-5px); }
        .img-card img { width: 100%; height: 220px; object-fit: cover; cursor: pointer; }
        .desc { padding: 12px; font-size: 14px; }
        .del-btn { width: 100%; padding: 8px; background: #333; color: #ff8888; border: none; cursor: pointer; }
        .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.93); display: none; align-items: center; justify-content: center; z-index: 999; }
        /* 大图使用 Canvas 显示，水印会直接绘制进 Canvas 像素中。 */
        #modalCanvas { max-width: 92%; max-height: 92vh; display: block; }
        .close { position: absolute; top: 24px; right: 36px; color: #fff; font-size: 42px; cursor: pointer; background: transparent; border: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>作品集在线画廊</h1><p>作品展示</p></div>
        <div class="upload-area">
            <h3>上传作品图片</h3>
            <p class="tip">图片上传至 Cloudinary；图片列表实时保存在 Firebase</p>
            <input type="file" id="fileInput" accept="image/*">
            <button class="btn" id="chooseButton" type="button">选择图片上传</button>
        </div>
        <div class="gallery" id="gallery"></div>
        <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="图片预览">
            <button class="close" id="closeButton" type="button" aria-label="关闭">&times;</button>
            <canvas id="modalCanvas" aria-label="带水印的作品大图"></canvas>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
        import { getAnalytics } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js';
        import { getDatabase, ref, onValue, push, remove } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyAI7WzUncIQ_ktlF4bc3Me07oO1WhABTCw',
            authDomain: 'portfolio-atom-3044f.firebaseapp.com',
            projectId: 'portfolio-atom-3044f',
            storageBucket: 'portfolio-atom-3044f.firebasestorage.app',
            messagingSenderId: '326548837023',
            appId: '1:326548837023:web:72f7d2364501a45f0448aa',
            measurementId: 'G-1GCRXSHHLL',
            databaseURL: 'https://portfolio-atom-3044f-default-rtdb.asia-southeast1.firebasedatabase.app/'
        };

        const app = initializeApp(firebaseConfig);
        getAnalytics(app);
        const database = getDatabase(app);
        const imagesRef = ref(database, 'galleryImages');

        const cloudName = 'trbh8p1q';
        const uploadPreset = 'atom_portfolio';
        const fileInput = document.getElementById('fileInput');
        const chooseButton = document.getElementById('chooseButton');
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalCanvas = document.getElementById('modalCanvas');
        let imageList = [];
        let activeImage = null;

        function renderGallery() {
            gallery.replaceChildren();
            imageList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'img-card';
                const image = document.createElement('img');
                image.src = item.url;
                image.alt = `作品 #${index + 1}`;
                image.addEventListener('click', () => openModal(item.url));
                const description = document.createElement('div');
                description.className = 'desc';
                description.textContent = `作品 #${index + 1}`;
                const deleteButton = document.createElement('button');
                deleteButton.className = 'del-btn';
                deleteButton.type = 'button';
                deleteButton.textContent = '删除';
                deleteButton.addEventListener('click', async () => {
                    if (!item.key) return;
                    try {
                        await remove(ref(database, `galleryImages/${item.key}`));
                    } catch (error) {
                        console.error('删除图片失败：', error);
                        alert(`删除失败：${error.message}`);
                    }
                });
                card.append(image, description, deleteButton);
                gallery.appendChild(card);
            });
        }

        onValue(imagesRef, snapshot => {
            const data = snapshot.val() || {};
            imageList = Object.entries(data)
                .filter(([, item]) => item && item.url)
                .map(([key, item]) => ({ key, url: item.url }));
            renderGallery();
        }, error => {
            console.error('读取 Firebase 图片列表失败：', error);
            alert(`读取图片列表失败：${error.message}`);
        });

        // 把原图绘制到 Canvas 后再绘制重复水印，避免大图预览直接暴露无水印图片元素。
        function drawWatermark(image) {
            const maxWidth = window.innerWidth * 0.92;
            const maxHeight = window.innerHeight * 0.86;
            const scale = Math.min(maxWidth / image.naturalWidth, maxHeight / image.naturalHeight, 1);
            const width = Math.max(1, Math.round(image.naturalWidth * scale));
            const height = Math.max(1, Math.round(image.naturalHeight * scale));
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            modalCanvas.width = Math.round(width * pixelRatio);
            modalCanvas.height = Math.round(height * pixelRatio);
            modalCanvas.style.width = `${width}px`;
            modalCanvas.style.height = `${height}px`;

            const context = modalCanvas.getContext('2d');
            context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            context.clearRect(0, 0, width, height);
            context.drawImage(image, 0, 0, width, height);

            context.save();
            context.globalAlpha = 0.28;
            context.fillStyle = '#ffffff';
            context.font = `600 ${Math.max(16, Math.min(30, width / 15))}px system-ui, sans-serif`;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.rotate(-Math.PI / 7);
            const spacingX = Math.max(180, width / 2);
            const spacingY = Math.max(90, height / 4);
            for (let y = -height; y < height * 2; y += spacingY) {
                for (let x = -width; x < width * 2; x += spacingX) {
                    context.fillText('作品集在线画廊', x, y);
                }
            }
            context.restore();
        }

        function openModal(src) {
            const image = new Image();
            // Cloudinary 需允许跨域读取，才能将图片安全地绘制到 Canvas。
            image.crossOrigin = 'anonymous';
            image.onload = () => {
                activeImage = image;
                drawWatermark(image);
                modal.style.display = 'flex';
            };
            image.onerror = () => alert('图片加载失败，无法生成带水印的大图。');
            image.src = src;
        }

        function closeModal() {
            modal.style.display = 'none';
            activeImage = null;
            const context = modalCanvas.getContext('2d');
            context.clearRect(0, 0, modalCanvas.width, modalCanvas.height);
        }

        chooseButton.addEventListener('click', () => fileInput.click());
        document.getElementById('closeButton').addEventListener('click', closeModal);
        modal.addEventListener('click', event => { if (event.target === modal) closeModal(); });
        document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
        window.addEventListener('resize', () => { if (activeImage) drawWatermark(activeImage); });

        fileInput.addEventListener('change', async event => {
            const file = event.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', uploadPreset);
            chooseButton.disabled = true;
            chooseButton.textContent = '上传中...';

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, { method: 'POST', body: formData });
                const responseText = await response.text();
                let data;
                try { data = JSON.parse(responseText); } catch { throw new Error(`Cloudinary 返回了非 JSON 数据（HTTP ${response.status}）：${responseText}`); }
                console.log('Cloudinary response:', { status: response.status, ok: response.ok, body: data });

                const imageUrl = data.secure_url || data.url;
                if (!response.ok || !imageUrl) {
                    const message = data.error?.message || data.message || responseText || 'Cloudinary 没有返回图片地址';
                    throw new Error(`上传失败：${message}`);
                }
                await push(imagesRef, { url: imageUrl });
                alert('上传成功！');
            } catch (error) {
                console.error('上传失败：', error);
                alert(error.message);
            } finally {
                fileInput.value = '';
                chooseButton.disabled = false;
                chooseButton.textContent = '选择图片上传';
            }
        });
    </script>
</body>
</html>
